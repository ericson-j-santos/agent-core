name: Agent Core Ruleset Bootstrap (Owner Only)

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
    paths:
      - "scripts/bootstrap_main_ruleset.py"
      - "tests/test_bootstrap_main_ruleset.py"
      - ".github/workflows/main-ruleset-bootstrap.yml"
      - ".github/rulesets/agent-core-main.json"

permissions:
  contents: read

concurrency:
  group: agent-core-admin-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bootstrap-contract-tests:
    name: bootstrap-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile and run controlled create-once tests
        run: |
          python -W error::SyntaxWarning -m compileall -q scripts/bootstrap_main_ruleset.py tests/test_bootstrap_main_ruleset.py
          python -m unittest discover -s tests -p 'test_bootstrap_main_ruleset.py' -v

  owner-authorized-bootstrap:
    name: owner-authorized-bootstrap
    if: >-
      github.repository == 'ericson-j-santos/agent-core' &&
      github.actor == 'ericson-j-santos' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/main-ruleset-bootstrap-20261014' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == true
    needs: [bootstrap-contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Refuse missing dedicated repository administration credential
        env:
          AGENT_CORE_RULESET_ADMIN_TOKEN: ${{ secrets.AGENT_CORE_RULESET_ADMIN_TOKEN }}
        run: |
          if [ -z "$AGENT_CORE_RULESET_ADMIN_TOKEN" ]; then
            echo "::error::admin_secret_missing_for_agent_core_only"
            exit 2
          fi
      - name: Reconcile only the reviewed main ruleset
        env:
          AGENT_CORE_RULESET_ADMIN_TOKEN: ${{ secrets.AGENT_CORE_RULESET_ADMIN_TOKEN }}
          EXPECTED_MAIN: ${{ github.event.pull_request.base.sha }}
        run: python scripts/bootstrap_main_ruleset.py --expected-main "$EXPECTED_MAIN"
      - name: Independent readback with administrative visibility
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_CORE_RULESET_ADMIN_TOKEN }}
        run: python scripts/audit_main_governance.py
