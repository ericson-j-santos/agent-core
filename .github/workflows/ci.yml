name: Agent Core CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  agent-core-test:
    name: agent-core-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Syntax and unit/regression tests
        run: |
          python -W error::SyntaxWarning -m compileall -q agent_core tests
          python -m unittest discover -s tests -v
      - name: Build and verify portable wheel
        run: |
          python -m pip wheel . --no-deps -w dist
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, 'wheel_missing_or_ambiguous'
          with zipfile.ZipFile(wheels[0]) as z:
              names = set(z.namelist())
          assert {'agent_core/__init__.py', 'agent_core/contracts.py',
                  'agent_core/registry.py', 'agent_core/github.py',
                  'agent_core/pr_context.py',
                  'agent_core/__main__.py'} <= names, 'wheel_missing_required_module'
          print('PORTABLE_WHEEL_VERIFIED')
          PY
      - name: Official GitHub read-only PR diagnostic and 404 control
        if: github.event_name == 'pull_request'
        env:
          AGENT_CORE_ALLOWED_REPOS: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          def invoke(args):
              return subprocess.run([sys.executable, '-m', 'agent_core'] + args,
                                    text=True, capture_output=True, timeout=45)
          args = ['diagnose-pr', '--repository', os.environ['TARGET_REPO'],
                  '--number', os.environ['TARGET_PR'],
                  '--expected-head', os.environ['EXPECTED_HEAD']]
          good = invoke(args)
          if good.returncode != 0:
              raise SystemExit('github_pr_read_failed')
          observed = json.loads(good.stdout)
          if (observed.get('head_sha') != os.environ['EXPECTED_HEAD']
                  or observed.get('merge_authorized') is not False
                  or observed.get('state_changed') is not False
                  or observed.get('evidence', {}).get('head_readback_stable') is not True):
              raise SystemExit('github_pr_readback_invalid')
          bad = invoke(['diagnose-pr', '--repository', os.environ['TARGET_REPO'],
                        '--number', '99999999'])
          if bad.returncode != 2 or json.loads(bad.stdout).get('reason_code') != 'github_http_404':
              raise SystemExit('github_negative_control_missing')
          research = invoke([
              'research-pr', '--repository', os.environ['TARGET_REPO'],
              '--number', os.environ['TARGET_PR'],
              '--expected-head', os.environ['EXPECTED_HEAD'],
              '--question', 'agent module', '--sources', 'README.md',
          ])
          if research.returncode != 0:
              raise SystemExit('github_context_read_failed')
          context = json.loads(research.stdout)
          evidence = context.get('evidence', {})
          if (context.get('head_sha') != os.environ['EXPECTED_HEAD']
                  or context.get('state_changed') is not False
                  or context.get('merge_authorized') is not False
                  or evidence.get('retrieval_state') != 'matched'
                  or evidence.get('pr_head_readback_stable') is not True
                  or not evidence.get('snippets')
                  or not evidence.get('sources')
                  or evidence['sources'][0].get('ref_sha') != os.environ['EXPECTED_HEAD']):
              raise SystemExit('github_context_readback_invalid')
          missing = invoke([
              'research-pr', '--repository', os.environ['TARGET_REPO'],
              '--number', os.environ['TARGET_PR'],
              '--expected-head', os.environ['EXPECTED_HEAD'],
              '--question', 'agent module',
              '--sources', 'docs/AGENT_CONTEXT_E2E_MISSING.md',
          ])
          if (missing.returncode != 2
                  or json.loads(missing.stdout).get('reason_code') != 'github_http_404'):
              raise SystemExit('github_context_negative_404_missing')
          print(json.dumps({
              'head_readback_verified': True,
              'github_404_control': True,
              'context_sha_and_content_verified': True,
              'context_missing_source_404_control': True,
          }))
          PY
