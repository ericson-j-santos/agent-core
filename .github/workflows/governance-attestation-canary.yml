name: Agent Core Read-only Ruleset Canary

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_readonly_attestation.py"
      - "tests/test_governance_attestation.py"
      - "config/governance/ruleset-attestation-v1.json"
      - ".github/workflows/governance-attestation-canary.yml"
      - ".github/workflows/main-governance-audit.yml"
      - ".github/workflows/main-ruleset-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: readonly-ruleset-canary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  unprivileged-attestation-e2e:
    name: unprivileged-attestation-e2e
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Static negative controls and replay
        run: |
          python -W error::SyntaxWarning -m compileall -q scripts/audit_readonly_attestation.py tests/test_governance_attestation.py
          python -m unittest discover -s tests -p 'test_governance_attestation.py' -v
      - name: Inspect public GitHub ruleset time encoding
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          base = "https://api.github.com/repos/ericson-j-santos/agent-core/"
          header = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28"}
          for path in ("rulesets?includes_parents=false", "rulesets/25099330"):
              req = urllib.request.Request(base + path, headers=header)
              with urllib.request.urlopen(req, timeout=15) as response:
                  data = json.load(response)
              item = data[0] if isinstance(data, list) and len(data) == 1 else data
              print(json.dumps({"source": path, "id": item.get("id"),
                                "updated_at": item.get("updated_at"),
                                "created_at": item.get("created_at"),
                                "bypass_visible": "bypass_actors" in item}, sort_keys=True))
          PY
      - name: Live GitHub metadata attestation without admin secret
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.audit_readonly_attestation
